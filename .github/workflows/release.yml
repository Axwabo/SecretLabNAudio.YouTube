name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7.0.1

      - uses: Axwabo/scpsl-references-downloader@v1
        id: refs

      - name: Build
        run: dotnet build -c Release -o Out
        env:
          SL_REFERENCES: ${{ steps.refs.outputs.target }} 

      - name: Create Bundle
        working-directory: Out
        run: dotnet run ../bundle.cs
        env:
          SL_REFERENCES: ${{ steps.refs.outputs.target }}
      
      - name: Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: Out/SecretLabNAudio.YouTube.dll,Out/SecretLabNAudio.YouTube.xml,Out/SecretLabNAudio.YouTube.Demo.dll,Out/dependencies.zip
          
      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: Axwabo
      
      - name: Push to NuGet
        working-directory: Out
        run: dotnet nuget push SecretLabNAudio.YouTube.*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
